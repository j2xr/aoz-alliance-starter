name: frontend

# No `paths:` filter on pull_request, on purpose: this job is a *required*
# status check on main. A path-filtered check simply never reports on a PR that
# doesn't touch its paths, and GitHub keeps such a PR blocked forever
# ("Expected — waiting for status to be reported"). Running it on every PR
# costs ~35s and makes the protection rule actually satisfiable.
# The push filter below is kept: there, nothing is waiting on the result.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
